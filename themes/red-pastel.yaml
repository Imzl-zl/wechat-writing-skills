aigc_footer: false
name: red-pastel
description: 从「Deepseek小黑鲸，玩大了」学习的排版主题——白底 + 红色强调 + 浅红卡片（小登登风）
colors:
  primary: '#dc2626'
  secondary: '#991b1b'
  text: '#1f2937'
  text_light: '#6b7280'
  background: '#ffffff'
  code_bg: '#f1f5f9'
  code_color: '#dc2626'
  quote_border: '#dc2626'
  quote_bg: '#fef2f2'
  border_radius: 3px
  darkmode:
    background: '#1e1e1e'
    text: '#d1d5db'
    text_light: '#9ca3af'
    primary: '#f87171'
    code_bg: '#2d2d2d'
    code_color: '#f87171'
    quote_bg: '#252525'
    quote_border: '#f87171'
base_css: |-
  body {
    font-family: -apple-system, "system-ui", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.8;
    color: #1f2937;
    background: #ffffff;
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
    word-wrap: break-word;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    color: #111827;
    margin: 32px 0 16px 0;
    padding-bottom: 12px;
    border-bottom: 2px solid #dc2626;
    line-height: 1.4;
  }

  h2 {
    font-size: 22px;
    font-weight: 700;
    color: #111827;
    margin: 28px 0 14px 0;
    padding: 8px 0 8px 12px;
    border-left: 4px solid #dc2626;
    border-bottom: 1px solid #fecaca;
    line-height: 1.4;
  }

  h3 {
    font-size: 18px;
    font-weight: 600;
    color: #111827;
    margin: 24px 0 12px 0;
    line-height: 1.4;
  }

  h4 {
    font-size: 16px;
    font-weight: 600;
    color: #111827;
    margin: 20px 0 10px 0;
    line-height: 1.4;
  }

  p {
    font-size: 16px;
    line-height: 1.8;
    color: #1f2937;
    margin: 14px 0;
    text-indent: 0;
  }

  strong {
    font-weight: 700;
    color: #dc2626;
  }

  em {
    font-style: italic;
    color: #dc2626;
  }

  mark {
    background: #fee2e2;
    color: #991b1b;
    padding: 2px 6px;
    border-radius: 3px;
  }

  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    background: #f1f5f9;
    color: #dc2626;
    padding: 2px 6px;
    border-radius: 3px;
  }

  pre {
    background: #1e293b;
    color: #e2e8f0;
    padding: 16px;
    border-radius: 3px;
    overflow-x: auto;
    margin: 16px 0;
    line-height: 1.6;
    text-indent: 0;
  }

  pre code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    font-size: 14px;
    background: none;
    color: #e2e8f0;
    padding: 0;
    border-radius: 0;
    text-indent: 0;
  }

  blockquote {
    border-left: 4px solid #dc2626;
    background: #fef2f2;
    margin: 16px 0;
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    color: #1f2937;
  }

  blockquote p {
    margin: 0;
    text-indent: 0;
    color: #1f2937;
  }

  ul {
    padding-left: 24px;
    margin: 12px 0;
  }

  ol {
    padding-left: 24px;
    margin: 12px 0;
  }

  li {
    font-size: 16px;
    line-height: 1.8;
    color: #1f2937;
    margin: 6px 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 15px;
  }

  thead {
    background: #dc2626;
  }

  th {
    background: #dc2626;
    color: #ffffff;
    font-weight: 600;
    padding: 10px 14px;
    text-align: left;
    border: 1px solid #dc2626;
  }

  td {
    padding: 10px 14px;
    border: 1px solid #fecaca;
    color: #1f2937;
  }

  tr {
    background: #ffffff;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 24px auto;
    border-radius: 3px;
  }

  a {
    color: #dc2626;
    text-decoration: none;
    font-weight: 500;
  }

  hr {
    border: none;
    border-top: 1px solid #fecaca;
    margin: 24px 0;
  }
