name: "knowledge-card"
description: "知识点卡风：h2→编号知识卡（结构用 apply_template.py --template knowledge-card --theme knowledge-card 生成），蓝+琥珀点缀，适合干货科普"
aigc_footer: false
colors:
  primary: "#2563eb"
  secondary: "#f59e0b"
  text: "#1f2937"
  text_light: "#6b7280"
  text_heading: "#1e3a8a"
  text_caption: "#9ca3af"
  background: "#ffffff"
  background_light: "#eff6ff"
  code_bg: "#1e293b"
  code_color: "#e2e8f0"
  quote_border: "#f59e0b"
  quote_bg: "#fffbeb"
  highlight_bg: "#fef3c7"
  summary_bg: "#eff6ff"
  border_radius: "8px"
  darkmode:
    background: "#0b1220"
    text: "#d1d5db"
    text_light: "#9ca3af"
    text_heading: "#dbeafe"
    primary: "#60a5fa"
    secondary: "#fbbf24"
    code_bg: "#111827"
    code_color: "#d4d4d4"
    quote_bg: "#151f31"
    quote_border: "#60a5fa"
    highlight_bg: "#1e2145"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.9;
    color: #1f2937;
    background: #ffffff;
    max-width: 677px;
    margin: 0 auto;
    padding: 20px 12px;
    word-wrap: break-word;
  }

  h1 {
    font-size: 20px;
    font-weight: 800;
    color: #1e3a8a;
    margin: 24px 0 18px 0;
    padding-bottom: 10px;
    border-bottom: 2px solid #2563eb;
    line-height: 1.4;
  }

  h2 { font-size: 16px; font-weight: 800; color: #1e3a8a; margin: 28px 0 12px 0; }
  h3 { font-size: 15px; font-weight: 700; color: #1e3a8a; margin: 22px 0 10px 0; }

  p { font-size: 15px; line-height: 1.9; color: #1f2937; margin: 0 0 16px 0; }

  strong { font-weight: 700; color: #1e3a8a; background-image: linear-gradient(120deg, #fef3c7 0%, rgba(255,255,255,0) 100%); padding: 0 3px; border-radius: 2px; }
  em { font-style: italic; color: #1f2937; }

  blockquote {
    margin: 18px 0;
    padding: 12px 16px;
    border: none;
    border-left: 4px solid #f59e0b;
    background: #fffbeb;
    border-radius: 0 8px 8px 0;
  }
  blockquote p { margin: 0; color: #78350f; }

  code {
    font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 13px;
    background: #eff6ff;
    color: #2563eb;
    padding: 2px 6px;
    border-radius: 4px;
  }

  pre { background: #1e293b; color: #e2e8f0; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 16px 0; }
  pre code { background: none; color: #e2e8f0; padding: 0; }

  ul, ol { padding-left: 26px; margin: 12px 0 16px 0; }
  li { font-size: 15px; line-height: 1.9; color: #1f2937; margin: 6px 0; }

  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
  th { background: #2563eb; color: #ffffff; font-weight: 700; padding: 9px 12px; text-align: left; border: 1px solid #2563eb; }
  td { padding: 9px 12px; border: 1px solid #e5e7eb; color: #1f2937; }

  img { max-width: 100%; height: auto; display: block; margin: 18px auto; border-radius: 8px; }

  a { color: #2563eb; text-decoration: none; font-weight: 500; }
  hr { border: none; border-top: 1px solid #e5e7eb; margin: 26px 0; }
