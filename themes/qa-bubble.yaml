name: "qa-bubble"
description: "问答气泡风：h2→「问」徽章聊天气泡（结构用 apply_template.py --template qa-bubble --theme qa-bubble 生成），微信绿点缀，适合 FAQ/测评"
aigc_footer: false
colors:
  primary: "#07c160"
  secondary: "#05934b"
  text: "#111827"
  text_light: "#6b7280"
  text_heading: "#111827"
  text_caption: "#9ca3af"
  background: "#ffffff"
  background_light: "#f0faf4"
  code_bg: "#1e293b"
  code_color: "#e2e8f0"
  quote_border: "#07c160"
  quote_bg: "#f0faf4"
  highlight_bg: "#d9f7e5"
  summary_bg: "#f0faf4"
  border_radius: "10px"
  darkmode:
    background: "#0b1220"
    text: "#d1d5db"
    text_light: "#9ca3af"
    text_heading: "#f3f4f6"
    primary: "#34d399"
    secondary: "#6ee7b7"
    code_bg: "#111827"
    code_color: "#d4d4d4"
    quote_bg: "#151f31"
    quote_border: "#34d399"
    highlight_bg: "#14311f"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.9;
    color: #111827;
    background: #ffffff;
    max-width: 677px;
    margin: 0 auto;
    padding: 20px 12px;
    word-wrap: break-word;
  }

  h1 {
    font-size: 20px;
    font-weight: 800;
    color: #111827;
    margin: 24px 0 18px 0;
    padding-bottom: 10px;
    border-bottom: 2px solid #07c160;
    line-height: 1.4;
  }

  h2 { font-size: 16px; font-weight: 800; color: #111827; margin: 28px 0 12px 0; }
  h3 { font-size: 15px; font-weight: 700; color: #111827; margin: 22px 0 10px 0; }

  p { font-size: 15px; line-height: 1.9; color: #111827; margin: 0 0 16px 0; }

  strong { font-weight: 700; color: #05934b; }
  em { font-style: italic; color: #111827; }

  blockquote {
    margin: 18px 0;
    padding: 12px 16px;
    border: none;
    border-left: 4px solid #07c160;
    background: #f0faf4;
    border-radius: 0 8px 8px 0;
  }
  blockquote p { margin: 0; color: #111827; }

  code {
    font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 13px;
    background: #f0faf4;
    color: #05934b;
    padding: 2px 6px;
    border-radius: 4px;
  }

  pre { background: #1e293b; color: #e2e8f0; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 16px 0; }
  pre code { background: none; color: #e2e8f0; padding: 0; }

  ul, ol { padding-left: 26px; margin: 12px 0 16px 0; }
  li { font-size: 15px; line-height: 1.9; color: #111827; margin: 6px 0; }

  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
  th { background: #07c160; color: #ffffff; font-weight: 700; padding: 9px 12px; text-align: left; border: 1px solid #07c160; }
  td { padding: 9px 12px; border: 1px solid #e5e7eb; color: #111827; }

  img { max-width: 100%; height: auto; display: block; margin: 18px auto; border-radius: 8px; }

  a { color: #05934b; text-decoration: none; font-weight: 500; }
  hr { border: none; border-top: 1px solid #e5e7eb; margin: 26px 0; }
