name: "emerald-tutorial"
description: "翠绿教程皮肤：只提供颜色和基础文字样式；教程仪表盘结构需配合 apply_template.py --template tutorial-dashboard 使用。"
aigc_footer: false
colors:
  primary: "#047857"
  secondary: "#f59e0b"
  text: "#1f2937"
  text_light: "#6b7280"
  text_heading: "#111827"
  text_caption: "#9ca3af"
  background: "#ffffff"
  background_light: "#f0fdf4"
  code_bg: "#1e3a5f"
  code_color: "#e0f2fe"
  quote_border: "#047857"
  quote_bg: "#f0fdf4"
  highlight_bg: "#fef3c7"
  summary_bg: "#f0fdf4"
  border_radius: "8px"
  darkmode:
    background: "#0f172a"
    text: "#d1d5db"
    text_light: "#94a3b8"
    text_heading: "#f8fafc"
    primary: "#34d399"
    secondary: "#fbbf24"
    code_bg: "#172554"
    code_color: "#dbeafe"
    quote_bg: "#12332f"
    quote_border: "#34d399"
    highlight_bg: "#3a2f14"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.9;
    letter-spacing: 0.4px;
    color: #1f2937;
    background: #ffffff;
    max-width: 677px;
    margin: 0 auto;
    padding: 20px 12px;
    word-wrap: break-word;
  }

  h1 {
    font-size: 22px;
    font-weight: 900;
    color: #111827;
    margin: 26px 0 18px;
    line-height: 1.35;
  }

  h2 {
    font-size: 19px;
    font-weight: 900;
    color: #111827;
    margin: 36px 0 14px;
    line-height: 1.35;
  }

  h3, h4 {
    font-size: 16px;
    font-weight: 800;
    color: #111827;
    margin: 24px 0 10px;
    line-height: 1.45;
  }

  p {
    font-size: 14px;
    line-height: 1.9;
    color: #1f2937;
    margin: 0 0 16px;
  }

  strong {
    font-weight: 800;
    color: #047857;
    background-image: linear-gradient(120deg, #fef3c7 0%, rgba(255,255,255,0) 100%);
    padding: 0 3px;
    border-radius: 2px;
  }

  em {
    font-style: normal;
    color: #374151;
  }

  blockquote {
    margin: 18px 0;
    padding: 10px 14px;
    border: 1px solid #bbf7d0;
    border-left: 3px solid #047857;
    border-radius: 0 8px 8px 0;
    background: #f0fdf4;
  }

  blockquote p {
    margin: 0;
    color: #374151;
  }

  code {
    font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 13px;
    color: #047857;
    background: #ecfdf5;
    padding: 2px 5px;
    border-radius: 3px;
  }

  pre {
    margin: 16px 0;
    padding: 14px;
    overflow-x: auto;
    border: 1px solid #1e3a5f;
    border-radius: 7px;
    background: #1e3a5f;
    color: #e0f2fe;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-all;
  }

  pre code {
    padding: 0;
    background: transparent;
    color: inherit;
  }

  ul, ol {
    margin: 12px 0 18px;
    padding-left: 26px;
  }

  li {
    font-size: 14px;
    line-height: 1.9;
    color: #1f2937;
    margin: 6px 0;
  }

  ul li::marker, ol li::marker {
    color: #047857;
    font-weight: 800;
  }

  table {
    width: 100%;
    margin: 16px 0;
    border-collapse: collapse;
    font-size: 13px;
  }

  table {
    table-layout: auto;
  }

  th, td {
    overflow-wrap: anywhere;
    word-break: break-word;
  }

    border: 1px solid #047857;
    background: #047857;
    color: #ffffff;
    font-weight: 800;
    text-align: left;
  }

  td {
    padding: 9px 10px;
    border: 1px solid #d1d5db;
    color: #374151;
    vertical-align: top;
  }

  tbody tr:nth-child(even) {
    background: #f9fafb;
  }

  img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 18px auto;
    border-radius: 6px;
  }

  a {
    color: #047857;
    font-weight: 700;
    text-decoration: none;
    border-bottom: 1px solid #a7f3d0;
  }

  hr {
    width: 48px;
    height: 2px;
    margin: 30px auto;
    border: 0;
    background: #047857;
  }
